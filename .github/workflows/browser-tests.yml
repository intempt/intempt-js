# Tier 3 — the WebKit browser tier.
#
# `BACKLOG.md` §3 parked cross-browser testing entirely on "blocker: money", on the
# assumption that it needs a device cloud. Half of it does not: WebKit — the engine
# Safari is built on — ships with Playwright and runs on the free `ubuntu-latest`
# runner. This workflow is that half.
#
# **Read `playwright.config.ts` before trusting a green run here.** WebKit is the
# engine, not the browser: this tier does NOT cover Safari's ITP, its 7-day cookie
# cap, or iOS storage eviction, and those are the half of the Safari risk that loses
# data quietly rather than failing loudly. Real Safari needs `safaridriver` over
# WebDriver (Playwright has no Safari channel) and iOS needs a device cloud; both stay
# in `BACKLOG.md` §3.
#
# `pull_request` only, like `e2e` and `mutation` in `ci.yml`. Browser downloads plus
# two runners is too slow for every push and exactly right before a merge.
name: Browser tests

on:
  pull_request:
    branches: ['**']

# A new push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit:
    name: WebKit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One leg failing is a finding, not a reason to cancel the other — the whole
      # point of two legs is comparing them.
      fail-fast: false
      matrix:
        # `ubuntu-latest` runs the Linux GTK/WPE port of WebKit; `macos-latest` runs
        # the build linked against Apple's own system frameworks. They fail
        # differently, and differently is the entire value of the second leg. macOS
        # runner minutes bill at 10x on private repos, which is affordable at
        # pull_request cadence and would not be on push.
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          cache: npm

      # Pinned for the same reason as every other workflow: the lock was generated by
      # npm 11 and a runner on npm 10.5 resolves the tree differently, which is what
      # made CI failures #1-2 in CHECKPOINT.md §0c unfindable locally.
      - name: Pin npm
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # WebKit on Linux needs system libraries the runner image does not carry;
      # `--with-deps` installs them. Chromium is the control leg (see the config).
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium

      # The tier tests the built artifact at the production CDN URL, not the source,
      # so the build is a prerequisite rather than a convenience.
      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
